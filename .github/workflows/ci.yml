name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Two plugin tests refuse to run without their virtualenv rather than skipping,
      # because a Python plugin answering is the claim they exist to check.
      - run: bun run plugin:setup
      # The boundary and portability tests are the two that decide whether core stayed
      # portable, and they run here with no container runtime. The tests that need an
      # image skip themselves, which is why this job is not proof a container still
      # launches.
      #
      # `bun run test` runs `bun test --isolate` (see package.json), not bare `bun
      # test`: Bun's bunfig.toml has no key for --isolate (checked against
      # src/cli/bunfig.zig and src/cli/Arguments.zig at bun-v1.3.14), so isolation
      # cannot live in config and has to be spelled out at every call site, this one
      # included.
      - run: bun run test
      - run: bun run build
