name: CLA

# pull_request_target is required so a fork's pull request can be commented on and
# marked. This job never checks out the pull request's code, which is what makes
# that trigger safe to use here.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit, not a tag: a tag can be moved under us.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/ForgePod/forgepod/blob/main/CLA.md
          # Signatures live on their own branch so signing never touches main.
          branch: cla-signatures
          path-to-signatures: signatures/version1/cla.json
          custom-notsigned-prcomment: >
            Thanks for the pull request. Before it can be merged, please read
            [CLA.md](https://github.com/ForgePod/forgepod/blob/main/CLA.md) and comment
            with the sentence below. It is once per person, not once per pull request,
            and it does not apply to plugins or templates in their own repositories.
          custom-pr-sign-comment: "I have read the CLA document and I hereby sign the CLA"
          custom-allsigned-prcomment: "CLA signed, thanks."
